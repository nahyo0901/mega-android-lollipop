name: Inspect build.sh SWIG invocation

on:
  workflow_dispatch:

permissions: read-all

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Grep swig usage in build.sh
        run: grep -n "swig" app/src/main/jni/build.sh